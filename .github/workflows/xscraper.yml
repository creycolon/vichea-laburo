name: XScraper · corrida diaria

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 en Buenos Aires (UTC-3)
  workflow_dispatch:

concurrency:
  group: xscraper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: xscraper/package-lock.json

      - name: Instalar dependencias
        working-directory: xscraper
        run: npm ci

      - name: Relevar fuentes
        working-directory: xscraper
        run: node cli.mjs

      - name: Escribir en Supabase
        working-directory: xscraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Sin SUPABASE_SERVICE_ROLE_KEY: se omite la ingesta."
          else
            node cli.mjs --ingest
          fi

      - name: Publicar snapshot en el repo
        run: |
          git config user.name "xscraper-bot"
          git config user.email "xscraper-bot@users.noreply.github.com"
          git add xscraper/data.json xscraper/history xscraper/index.html
          if git diff --staged --quiet; then
            echo "Sin cambios respecto del último commit."
          else
            git commit -m "chore(xscraper): corrida $(date -u +%F)"
            git push
          fi
